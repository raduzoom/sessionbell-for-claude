<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solid version for reduced transparency, light and dark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sn.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2640px; height: 880px; display: flex; gap: 80px">
  <dc-import name="Main" theme="light" layout="desktop" solid="yes" hint-size="1280px,880px"></dc-import>
  <dc-import name="Main" theme="dark" layout="desktop" solid="yes" hint-size="1280px,880px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2640,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
