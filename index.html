<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#E3E8EE">
<meta name="apple-mobile-web-app-title" content="Sessionbell">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sessionbell</title>
<style>
/* From design/claude-design-result/sn.css (approved canvas 1794503645-b4b3). */
/* Sessionbell: tokens + components. Spacing on an 8 pt grid; 4 only inside controls. */

.sn {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  --r-xl: 28px; --r-lg: 24px; --r-md: 16px; --r-sm: 12px; --r-pill: 999px;
  --blur: 24px; --sat: 160%;
  --dur: 160ms; --ease: cubic-bezier(.2, .8, .2, 1);
  font-family: var(--font);
  color: var(--ink-1);
  background: var(--backdrop);
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}
.sn *, .sn *::before, .sn *::after { box-sizing: border-box; }
.sn button { font-family: inherit; }

/* ---------- Light ---------- */
.sn-light {
  --backdrop: radial-gradient(900px 640px at 12% 0%, #EEF1F5 0%, rgba(238,241,245,0) 70%), radial-gradient(800px 700px at 100% 100%, #C9D2DC 0%, rgba(201,210,220,0) 70%), #DCE2E9;
  --backdrop-solid: #E3E8EE;
  --glass: rgba(247,249,251,.82);
  --glass-strong: rgba(251,252,253,.90);
  --glass-solid: #EFF2F5;
  --glass-strong-solid: #F6F8FA;
  --glass-edge: rgba(255,255,255,.80);
  --glass-line: rgba(30,42,58,.10);
  --shadow-panel: 0 1px 2px rgba(30,42,58,.06), 0 16px 40px rgba(30,42,58,.10);
  --shadow-pop: 0 2px 6px rgba(30,42,58,.10), 0 24px 56px rgba(30,42,58,.20);
  --ink-1: #1E1E1E; --ink-2: #454D59; --ink-3: #59616D;
  --ink-line: rgba(30,42,58,.14);
  --hover: rgba(30,42,58,.05); --sel: rgba(30,42,58,.08); --press: rgba(30,42,58,.12);
  --accent: #17784F; --accent-hover: #13663F; --accent-press: #0F5434; --on-accent: #FFFFFF;
  --stuck-ink: #7F4700; --stuck-bg: #FBEBD3; --stuck-line: #A8691A;
  --blocked-ink: #24497F; --blocked-bg: #E2EAF6; --blocked-line: #4F74AC;
  --err-ink: #A6200F; --err-bg: #FCE9E6; --err-line: #D98E83;
  --pill-active: #1E1E1E; --on-pill-active: #FFFFFF; --pc-active: rgba(255,255,255,.20);
  --toast: rgba(30,30,30,.92); --on-toast: #FFFFFF; --toast-hover: rgba(255,255,255,.14);
  --focus: #1E1E1E;
  --bubble: #FFFFFF; --bubble-line: rgba(30,42,58,.10);
  --disabled-bg: #DDE1E6; --disabled-ink: #6B727D;
  --scrim: rgba(30,42,58,.20);
  --av-clay-bg: #EBDCD3; --av-clay-ink: #6A4334;
  --av-slate-bg: #DCE3EB; --av-slate-ink: #364A5E;
  --av-mauve-bg: #E6DFEB; --av-mauve-ink: #534064;
  --av-sand-bg: #EDE4CF; --av-sand-ink: #5E4C22;
  --av-stone-bg: #E4E2DD; --av-stone-ink: #4A463F;
}

/* ---------- Dark ---------- */
.sn-dark {
  --backdrop: radial-gradient(900px 640px at 12% 0%, #262E38 0%, rgba(38,46,56,0) 70%), radial-gradient(800px 700px at 100% 100%, #0D1116 0%, rgba(13,17,22,0) 70%), #161B22;
  --backdrop-solid: #161B22;
  --glass: rgba(27,33,41,.78);
  --glass-strong: rgba(31,38,47,.88);
  --glass-solid: #1D242C;
  --glass-strong-solid: #202730;
  --glass-edge: rgba(255,255,255,.07);
  --glass-line: rgba(255,255,255,.10);
  --shadow-panel: 0 1px 2px rgba(0,0,0,.30), 0 16px 40px rgba(0,0,0,.35);
  --shadow-pop: 0 2px 6px rgba(0,0,0,.35), 0 24px 56px rgba(0,0,0,.55);
  --ink-1: #ECEFF3; --ink-2: #BCC4CE; --ink-3: #A3ACB8;
  --ink-line: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.08); --press: rgba(255,255,255,.12);
  --accent: #3FB37E; --accent-hover: #52C08C; --accent-press: #34A070; --on-accent: #08170F;
  --stuck-ink: #F3C27A; --stuck-bg: #3A2D18; --stuck-line: #B98432;
  --blocked-ink: #A9C6F2; --blocked-bg: #1F2D42; --blocked-line: #6F95CF;
  --err-ink: #FFB4A9; --err-bg: #41201C; --err-line: #A9554A;
  --pill-active: #ECEFF3; --on-pill-active: #15191F; --pc-active: rgba(0,0,0,.10);
  --toast: rgba(236,239,243,.94); --on-toast: #1E1E1E; --toast-hover: rgba(0,0,0,.08);
  --focus: #ECEFF3;
  --bubble: #2A323C; --bubble-line: rgba(255,255,255,.08);
  --disabled-bg: #2C333C; --disabled-ink: #8D96A2;
  --scrim: rgba(0,0,0,.40);
  --av-clay-bg: #4A3830; --av-clay-ink: #F2DCD0;
  --av-slate-bg: #33404D; --av-slate-ink: #D9E4EF;
  --av-mauve-bg: #3F3549; --av-mauve-ink: #E6DAF0;
  --av-sand-bg: #46402F; --av-sand-ink: #EFE5CA;
  --av-stone-bg: #3B3A37; --av-stone-ink: #E4E1DA;
}

/* ---------- Glass (large surfaces only) ---------- */
.glass, .glass-strong {
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-panel);
}
.glass { background: var(--glass); }
.glass-strong { background: var(--glass-strong); }

/* Solid version: reduced transparency, no backdrop-filter, or forced for review */
.sn-solid { background: var(--backdrop-solid); }
.sn-solid .glass, .sn-solid .glass-strong { -webkit-backdrop-filter: none; backdrop-filter: none; }
.sn-solid .glass { background: var(--glass-solid); }
.sn-solid .glass-strong { background: var(--glass-strong-solid); }
@media (prefers-reduced-transparency: reduce) {
  .sn { background: var(--backdrop-solid); }
  .sn .glass, .sn .glass-strong { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .sn .glass { background: var(--glass-solid); }
  .sn .glass-strong { background: var(--glass-strong-solid); }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .sn { background: var(--backdrop-solid); }
  .sn .glass { background: var(--glass-solid); }
  .sn .glass-strong { background: var(--glass-strong-solid); }
}

/* ---------- Icons ---------- */
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; }
.ic-xs { width: 14px; height: 14px; stroke-width: 2; }
.ic-lg { width: 24px; height: 24px; }
.spin { animation: sn-spin .9s linear infinite; }
@keyframes sn-spin { to { transform: rotate(360deg); } }

/* ---------- Frame layout ---------- */
.sn-frame { display: flex; gap: 16px; padding: 24px; }
.lay-half { padding: 16px; }
.lay-phone { padding: 0; gap: 0; flex-direction: column; }

.rail { flex: none; width: 72px; border-radius: var(--r-xl); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px 0; position: relative; z-index: 5; }

/* Project rail (1280 and 800): monogram avatars with a count badge */
.rail-projects { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.rail-item { position: relative; flex: none; width: 48px; height: 48px; padding: 0; border: 0; border-radius: var(--r-pill); background: transparent; display: grid; place-items: center; cursor: pointer; transition: box-shadow var(--dur) var(--ease); }
.rail-item:hover, .rail-item.is-hover { box-shadow: 0 0 0 4px var(--hover); }
.rail-item:focus-visible, .rail-item.is-focus { outline: 2px solid var(--focus); outline-offset: 4px; }
.rail-item.is-active .rail-av { box-shadow: 0 0 0 2px var(--glass-solid), 0 0 0 4px var(--ink-1); }
.av-all { background: var(--sel); color: var(--ink-1); font-size: 13px; }
.av-soon { background: transparent; color: var(--ink-3); border: 1px dashed var(--ink-3); }
.rail-badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: var(--r-pill); background: var(--pill-active); color: var(--on-pill-active); font: 600 12px/20px var(--font); text-align: center; box-shadow: 0 0 0 2px var(--glass-solid); }
.rail-badge.has-asked { background: var(--accent); color: var(--on-accent); }
.rail-tip { position: absolute; left: calc(100% + 16px); top: 50%; transform: translateY(-50%); z-index: 20; display: none; padding: 4px 8px; border-radius: 8px; background: var(--pill-active); color: var(--on-pill-active); font: 500 13px/20px var(--font); white-space: nowrap; pointer-events: none; box-shadow: var(--shadow-pop); }
.rail-item:hover .rail-tip, .rail-item:focus-visible .rail-tip, .rail-item.is-tip .rail-tip { display: block; }
.lay-phone .rail { display: none; }
.mark { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-1); background: var(--sel); }
.theme-seg { display: flex; flex-direction: column; gap: 8px; padding: 4px; border-radius: var(--r-pill); background: var(--hover); }

.col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.lay-phone .col { gap: 0; height: 100%; }

.hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; min-height: 56px; padding: 0 8px; }
.hdr h1 { margin: 0; font: 600 28px/36px var(--font); letter-spacing: -0.01em; color: var(--ink-1); }
.lay-half .hdr h1 { font-size: 24px; line-height: 32px; }
.sn .hdr-theme { display: none; }
.lay-phone .hdr { padding: 16px 16px 16px; align-items: center; min-height: 0; }
.lay-phone .hdr h1 { flex: 1; font-size: 22px; line-height: 28px; }
.sn.lay-phone .hdr-theme { display: grid; }
.lay-phone .hdr-right { width: 100%; }
.lay-phone.pv-session .hdr, .lay-phone.pv-session .banner { display: none; }

.status { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: var(--r-pill); font: 500 13px/16px var(--font); color: var(--ink-2); background: var(--hover); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--ink-3); }
.status.late { color: var(--stuck-ink); background: var(--stuck-bg); border: 1px solid var(--stuck-line); font-weight: 600; }
.lay-phone .status { height: 28px; padding: 0 8px; background: none; }
.lay-phone .status.late { padding: 0 8px; background: var(--stuck-bg); }

.panes { flex: 1; min-height: 0; display: flex; gap: 16px; position: relative; }
.list { flex: none; width: 520px; min-height: 0; display: flex; flex-direction: column; border-radius: var(--r-xl); overflow: hidden; }
.lay-half .list { flex: 1; width: auto; }
.lay-phone .list { flex: 1; width: auto; border-radius: var(--r-xl) var(--r-xl) 0 0; border-bottom: 0; }

.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: var(--r-xl); }
.scrim { display: none; }
.lay-half .detail { position: absolute; top: 0; right: 0; bottom: 0; width: 520px; z-index: 4; box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-pop); transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; visibility: hidden; transition: transform 200ms var(--ease), opacity 200ms var(--ease), visibility 0s linear 200ms; }
.lay-half.sheet-open .detail { transform: none; opacity: 1; pointer-events: auto; visibility: visible; transition: transform 200ms var(--ease), opacity 200ms var(--ease), visibility 0s; }
.lay-half.sheet-open .scrim { display: block; position: absolute; inset: 0; background: var(--scrim); border-radius: var(--r-xl); z-index: 3; }
.lay-phone .detail { position: absolute; inset: 0; z-index: 4; border-radius: 0; border: 0; display: none; }
.lay-phone.pv-session .detail { display: flex; }
.only-phone, .only-half { display: none !important; }
.lay-phone .only-phone { display: grid !important; }
.lay-half .only-half { display: grid !important; }

/* ---------- Project pills ---------- */
.pills { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 16px 16px 8px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pills.sub { padding-top: 0; flex-wrap: wrap; overflow: visible; }
.lay-desktop .pills.top, .lay-half .pills.top { display: none; }
.list-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 24px 24px 16px; }
.list-head h2 { margin: 0; font: 600 17px/24px var(--font); color: var(--ink-1); }
.lay-phone .list-head { display: none; }
.pill { flex: none; height: 44px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--ink-line); background: transparent; color: var(--ink-1); display: inline-flex; align-items: center; gap: 8px; font: 600 14px/20px var(--font); cursor: pointer; white-space: nowrap; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.pill:hover, .pill.is-hover { background: var(--hover); }
.pill:active, .pill.is-pressed { background: var(--press); }
.pill:focus-visible, .pill.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
.pill.is-active { background: var(--pill-active); color: var(--on-pill-active); border-color: transparent; }
.pc { min-width: 24px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--sel); font: 600 12px/24px var(--font); text-align: center; }
.pill.is-active .pc { background: var(--pc-active); }
.pa { height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font: 600 12px/24px var(--font); }
.pill.soon { color: var(--ink-3); border-style: dashed; font-weight: 500; }
.soon-tag { font: 500 12px/16px var(--font); color: var(--ink-3); }
.pills.sub .pill { font-weight: 500; }
.pills.sub .pill.is-active { background: var(--sel); color: var(--ink-1); border: 1px solid var(--ink-1); }
.pills.sub .pill.is-active .pc { background: var(--sel); }

.fnote { display: flex; align-items: center; gap: 8px; margin: 8px 8px 0; padding: 0 0 0 16px; border-radius: var(--r-md); background: var(--hover); font: 500 14px/20px var(--font); color: var(--ink-2); }
.fnote span { flex: 1; }

/* ---------- List ---------- */
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 96px; position: relative; scrollbar-width: thin; }
.sec { display: flex; align-items: center; gap: 8px; padding: 24px 16px 8px; margin: 0; font: 600 15px/20px var(--font); color: var(--ink-1); }
.count { min-width: 24px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--sel); font: 600 12px/24px var(--font); text-align: center; color: var(--ink-1); }

.row { display: flex; gap: 16px; align-items: flex-start; width: 100%; padding: 16px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-1); text-align: left; font: inherit; cursor: pointer; transition: background var(--dur) var(--ease); }
.row:hover, .row.is-hover { background: var(--hover); }
.row:active, .row.is-pressed { background: var(--press); }
.row.is-selected { background: var(--sel); }
.row:focus-visible, .row.is-focus { outline: 2px solid var(--focus); outline-offset: -2px; }

/* Row wrapper: holds the row and, at 800, its More actions button */
.row-wrap { position: relative; display: flex; align-items: center; border-radius: var(--r-md); }
.row-wrap > .row { flex: 1; min-width: 0; width: auto; }
.row-wrap.is-selected { background: var(--sel); }
.row-wrap .row.is-selected { background: transparent; }
.lay-half .row-wrap:hover { background: var(--hover); }
.lay-half .row-wrap .row:hover { background: transparent; }
.more { position: relative; flex: none; padding-right: 8px; }
.more-btn { border-color: var(--ink-line); }
.menu.row-menu { top: calc(100% + 8px); bottom: auto; right: 8px; }
.menu.ctx-menu { top: 0; left: 0; right: auto; bottom: auto; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row-top { display: flex; align-items: flex-start; gap: 8px; }
.row-title { flex: 1; min-width: 0; font: 600 15px/20px var(--font); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.quiet .row-title { font-weight: 500; }
.row.is-unread .row-title { font-weight: 700; }
.row-time { flex: none; font: 400 13px/20px var(--font); color: var(--ink-3); white-space: nowrap; }
.row-bottom { display: flex; align-items: flex-start; gap: 8px; }
.row-needs { flex: 1; min-width: 0; font: 400 14px/20px var(--font); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-needs.one { -webkit-line-clamp: 1; }
.row-needs.note { font-style: italic; }
.row.sched { align-items: center; padding: 8px 16px; }
.sched-ic { flex: none; width: 48px; height: 48px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--sel); color: var(--ink-2); }
.sched-line { flex: 1; min-width: 0; font: 400 14px/20px var(--font); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-line b { font-weight: 600; color: var(--ink-1); }
.sched-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

.av { flex: none; width: 48px; height: 48px; border-radius: var(--r-pill); display: grid; place-items: center; font: 600 15px/1 var(--font); letter-spacing: 0.02em; }
.av-sm { width: 40px; height: 40px; font-size: 14px; }
.av-xs { width: 32px; height: 32px; font-size: 12px; }
.av-clay { background: var(--av-clay-bg); color: var(--av-clay-ink); }
.av-slate { background: var(--av-slate-bg); color: var(--av-slate-ink); }
.av-mauve { background: var(--av-mauve-bg); color: var(--av-mauve-ink); }
.av-sand { background: var(--av-sand-bg); color: var(--av-sand-ink); }
.av-stone { background: var(--av-stone-bg); color: var(--av-stone-ink); }

/* ---------- State badges (colour + label + shape) ---------- */
.badge { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); font: 600 12px/16px var(--font); white-space: nowrap; border: 1px solid transparent; }
.b-asked { background: var(--accent); color: var(--on-accent); }
.b-stuck { background: var(--stuck-bg); color: var(--stuck-ink); border: 1px dashed var(--stuck-line); }
.b-blocked { background: var(--blocked-bg); color: var(--blocked-ink); border-color: var(--blocked-line); }
.b-review { background: transparent; color: var(--ink-2); border-color: var(--ink-3); }
.b-unread { background: transparent; color: var(--ink-2); padding: 0 4px; }
.b-read { background: var(--sel); color: var(--ink-2); }   /* a pinned session you've read */
.row-pin { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1.5px solid var(--ink-2); border-radius: var(--r-pill); color: var(--ink-1); }
.row-pin .ic-xs { width: 12px; height: 12px; }
.sched-line .row-pin { display: inline-grid; vertical-align: -5px; margin-right: 8px; }
.d-pin { display: inline-flex; align-items: center; gap: 4px; }
.udot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--ink-1); }

/* ---------- Archive-style rows (Stale, Hidden) ---------- */
.arch { display: flex; align-items: center; gap: 16px; width: 100%; height: 56px; margin-top: 8px; padding: 0 16px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-1); font: 600 15px/20px var(--font); text-align: left; cursor: pointer; transition: background var(--dur) var(--ease); }
.arch:hover, .arch.is-hover { background: var(--hover); }
.arch:active { background: var(--press); }
.arch:focus-visible, .arch.is-focus { outline: 2px solid var(--focus); outline-offset: -2px; }
.arch-ic { flex: none; width: 48px; display: grid; place-items: center; color: var(--ink-2); }
.arch-label { flex: 1; min-width: 0; }
.arch-count { font: 500 14px/20px var(--font); color: var(--ink-3); }
.arch .chev { color: var(--ink-2); transition: transform var(--dur) var(--ease); }
.arch.is-open .chev { transform: rotate(90deg); }

.hrow { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--r-md); }
.hrow .row-main { gap: 4px; }
.hreason { display: flex; align-items: center; gap: 8px; font: 400 13px/16px var(--font); color: var(--ink-3); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 32px 24px 24px; }
.em-icon { width: 56px; height: 56px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--sel); color: var(--ink-1); }
.empty h3 { margin: 8px 0 0; font: 600 17px/24px var(--font); }
.empty p { margin: 0; font: 400 14px/20px var(--font); color: var(--ink-3); }
.errnote { margin: 24px 16px; font: 400 14px/20px var(--font); color: var(--ink-3); }

/* ---------- Detail ---------- */

.lay-half .d-head { padding: 16px 24px; }

.lay-phone .reply-input { padding: 12px 16px; }

    var status;
    if (!d) status = null;
    else if (err) status = h('span', { class: 'status', role: 'status', text: d.generatedAt ? 'Last scan ' + since(now - d.generatedAt) : 'No scan yet' });
    else if (late) status = h('span', { class: 'status late', role: 'status' }, [icon('warn', 'ic-sm'), "Scanner hasn't run for " + ago(now - d.generatedAt)]);
    else status = h('span', { class: 'status', role: 'status' }, [h('span', { class: 'dot', 'aria-hidden': 'true' }), 'Scanned ' + since(now - (d.generatedAt || now)) + ' · ' + (num(d.counts.scanned) || 0) + ' session files']);
    var t = theme();
    return h('header', { class: 'hdr' }, [
      h('h1', { text: 'Sessionbell' }),
      h('div', { class: 'hdr-right' }, [status]),
      // New session (added 2026-11-16): outlined, so the reply bar's Send reply stays the one filled button.
      h('div', { class: 'hdr-new' }, [
        h('button', { class: 'btn btn-secondary btn-sm', type: 'button', 'aria-haspopup': 'dialog', 'aria-expanded': S.menu === 'new' ? 'true' : 'false',
                      'aria-label': 'New session', title: 'Start a new session in a project folder', 'data-key': 'new:btn', onclick: togglePicker },
          [icon('plus', 'ic-sm'), h('span', { class: 'lbl', text: 'New session' })]),
        S.menu === 'new' ? pickerView(items) : null
      ]),
      h('button', { class: 'icon-btn hdr-theme', type: 'button', 'aria-label': t === 'light' ? 'Switch to dark theme' : 'Switch to light theme', 'data-key': 'theme:toggle', onclick: function () { setTheme(t === 'light' ? 'dark' : 'light', 'theme:toggle'); } }, [icon(t === 'light' ? 'moon' : 'sun')])
    ]);
  }

  function render() {
    if (S.composing) { S.renderLater = true; return; }
    var now = Date.now();
    var d = S.data;
    var err = !!(d && d.error);
    var late = !!(d && !err && d.generatedAt && now - d.generatedAt > LATE_MS);
    S.layout = opts.layout || layoutFor(window.innerWidth);
    if (S.layout !== 'half') S.sheet = false;
    if (S.layout !== 'phone') S.phoneView = 'list';

    var items = menu();
    // Check the saved view only against real data: before the first load (or during an error) the menu is
    // just "All", and resetting then would throw the saved project away.
    if (d && !d.error) {
      var proj = null;
      items.forEach(function (p) { if (p.id === S.project) proj = p; });
      if (!proj) { S.project = 'all'; S.sub = 'all'; }
      else if (S.sub !== 'all' && S.sub !== 'general' && !proj.children.some(function (c) { return c.id === S.sub; })) S.sub = 'all';
    }
    var v = view();
    var card = S.selected ? byId(v, S.selected) : null;
    if (!card) {
      S.selected = null;
      if (S.layout === 'desktop' && (v.needs.length || v.sched.length)) { card = (v.needs[0] || v.sched[0]); S.selected = card.sessionId; }
      S.sheet = false; S.phoneView = 'list';
    }

    // Keep focus and scroll across re-renders (the page re-renders on every poll).
    var active = document.activeElement;
    var keepKey = S.focusNext || (active && active.getAttribute && active.getAttribute('data-key'));
    var caret = active && active.tagName === 'TEXTAREA' ? [active.selectionStart, active.selectionEnd, active.scrollTop] : null;
    var oldScroll = document.getElementById('sn-scroll');
    var scrollTop = oldScroll ? oldScroll.scrollTop : 0;
    // The New session picker: keep its list's scroll (back to the top when the search changes) and the cursor.
    var pickCaret = active && active.classList && active.classList.contains('pk-input') ? [active.selectionStart, active.selectionEnd] : null;
    var oldPick = document.getElementById('sn-pick-scroll');
    var pickTop = oldPick && !S.pickReset ? oldPick.scrollTop : 0;
    S.pickReset = false;

    var root = h('div', {}, [
      h('div', { class: 'col' }, [
        headerView(err, late, now, items),
        err ? h('div', { class: 'banner', role: 'alert' }, [icon('alert'), h('div', {}, [h('h2', { text: "Can't show sessions right now" }), h('p', { text: d.error })])]) : null,
        projectBar(items, err),
        h('div', { class: 'panes' }, [
          listView(items, v, err, now),
          h('div', { class: 'scrim', 'aria-hidden': 'true' }),
          detailView(items, card, err)
        ])
      ]),
      toastView()
    ]);
    app.className = 'sn sn-frame sn-' + theme() + ' lay-' + S.layout + (opts.solid ? ' sn-solid' : '') +
      (S.layout === 'phone' && S.phoneView === 'session' ? ' pv-session' : '') + (S.layout === 'half' && S.sheet ? ' sheet-open' : '');
    app.replaceChildren.apply(app, Array.prototype.slice.call(root.childNodes));
    app.removeAttribute('aria-busy');

    var scroll = document.getElementById('sn-scroll');
    if (scroll) scroll.scrollTop = scrollTop;
    var ctxMenu = app.querySelector('.ctx-menu');
    if (ctxMenu) placeCtx(ctxMenu);
    var pickList = document.getElementById('sn-pick-scroll');
    if (pickList) pickList.scrollTop = pickTop;
    if (keepKey) {
      var target = app.querySelector('[data-key="' + CSS.escape(keepKey) + '"]');
      // A session without a valid link has a disabled Open button: land on Close or Back instead,
      // so focus is always inside the slide-over or session view.
      if (target && target.disabled && S.focusNext) target = app.querySelector('.detail [data-key="close"], .detail [data-key="back"]');
      if (target && target.getClientRects().length === 0 && S.focusNext === 'open') target = null;
      if (target && (S.focusNext || active !== document.body)) target.focus({ preventScroll: !S.focusNext });
    }
    var replyBox = app.querySelector('.reply-input');
    if (replyBox) {
      fitReply(replyBox);
      // The poll re-renders while you type: keep the cursor where it was.
      if (document.activeElement === replyBox) {
        var at = caret && !S.focusNext ? caret : [replyBox.value.length, replyBox.value.length, replyBox.scrollHeight];
        replyBox.setSelectionRange(Math.min(at[0], replyBox.value.length), Math.min(at[1], replyBox.value.length));
        replyBox.scrollTop = at[2];
      }
    }
    var pickInput = app.querySelector('.pk-input');
    if (pickInput && pickCaret && document.activeElement === pickInput) pickInput.setSelectionRange(pickCaret[0], pickCaret[1]);
    S.focusNext = null;

    var total = d && !err ? needList(d).length : null;
    // A stopped scanner is as alarming as an error: the count may be wrong, so the tab says "(!)".
    document.title = !d ? 'Sessionbell' : ((err || late) ? '(!) Sessionbell' : '(' + total + ') Sessionbell');
    appChrome(!d ? null : (err || late) ? '!' : total);
  }

  // ---------- Keyboard ----------
  function rovingKeys(e) {
    var btns = Array.prototype.slice.call(e.currentTarget.querySelectorAll('button'));
    var i = btns.indexOf(document.activeElement), j = null;
    if (i < 0) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') j = Math.min(btns.length - 1, i + 1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') j = Math.max(0, i - 1);
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = btns.length - 1;
    if (j === null) return;
    e.preventDefault();
    btns.forEach(function (b) { b.tabIndex = -1; });
    btns[j].tabIndex = 0;
    btns[j].focus();
  }
  function listKeys(e) {
    var t = e.target;
    var sid = t && t.getAttribute && t.getAttribute('data-sid');
    if (!sid) return;
    var nav = view().nav.map(function (c) { return c.sessionId; });
    var i = nav.indexOf(sid), n = null;
    if (e.key === 'ArrowDown') n = nav[Math.min(nav.length - 1, i + 1)];
    else if (e.key === 'ArrowUp') n = nav[Math.max(0, i - 1)];
    else if (e.key === 'Home') n = nav[0];
    else if (e.key === 'End') n = nav[nav.length - 1];
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (S.layout === 'desktop') {
        var card = byId(view(), sid);
        S.selected = sid;
        if (card && safeLink(card)) { window.location.href = card.link; openSession(card); }
        render();
      } else pick(sid, true);
      return;
    }
    if (!n) return;
    e.preventDefault();
    if (S.layout === 'desktop') { S.selected = n; }
    S.focusNext = 'row:' + n;
    if (S.layout !== 'desktop') {
      // At 800 and on the phone, arrows only move focus; the slide-over or session view opens with Enter.
      // The row's More actions button is the next Tab stop after the row.
      var rows = Array.prototype.slice.call(document.querySelectorAll('#sn-scroll [data-sid], #sn-scroll .more-btn'));
      rows.forEach(function (r) { r.tabIndex = -1; });
      var next = document.querySelector('#sn-scroll [data-key="' + CSS.escape('row:' + n) + '"]');
      var moreBtn = document.querySelector('#sn-scroll [data-key="' + CSS.escape('more:' + n) + '"]');
      if (moreBtn) moreBtn.tabIndex = 0;
      if (next) { next.tabIndex = 0; next.focus(); }
      S.focusNext = null;
      return;
    }
    render();
  }
  function detailKeys(e) {
    if (e.key === 'Tab' && S.layout === 'half' && S.sheet) {
      var f = Array.prototype.slice.call(e.currentTarget.querySelectorAll('button:not([disabled]), a[href], textarea'))
        .filter(function (el) { return el.getClientRects().length > 0; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  }
  function closeMenu(refocus) {
    if (!S.menu) return;
    S.menu = null;
    if (refocus) S.focusNext = S.menuReturn;
    render();
  }
  function menuKeys(e) {
    var items = Array.prototype.slice.call(e.currentTarget.querySelectorAll('.menu-item'));
    var i = items.indexOf(document.activeElement), j = null;
    if (e.key === 'ArrowDown') j = (i + 1) % items.length;
    else if (e.key === 'ArrowUp') j = (i - 1 + items.length) % items.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = items.length - 1;
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(true); return; }
    else if (e.key === 'Tab') { S.menu = null; S.focusNext = S.menuReturn; e.preventDefault(); render(); return; }
    if (j === null) return;
    e.preventDefault();
    items[j].focus();
  }
  // A click anywhere outside an open menu (or its button) closes it.
  document.addEventListener('click', function (e) {
    if (!S.menu || !e.target.closest) return;
    if (e.target.closest('.menu') || e.target.closest('[aria-haspopup]')) return;
    closeMenu(false);
  });
  // A right-click anywhere else closes it too (a row's own right-click has already opened its menu).
  document.addEventListener('contextmenu', function (e) {
    if (!S.menu || e.defaultPrevented || (e.target.closest && e.target.closest('.menu'))) return;
    closeMenu(false);
  });
  document.addEventListener('keydown', function (e) {
    // ⌘Z (Ctrl+Z) undoes while the toast offers Undo, so keyboard users needn't Tab to it (review finding).
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && S.toast && S.toast.undo &&
        !(e.target && e.target.closest && e.target.closest('input, textarea, [contenteditable]'))) {
      e.preventDefault();
      restore(S.toast.undo, true);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.menu) { e.preventDefault(); closeMenu(true); return; }
    if ((S.layout === 'half' && S.sheet) || (S.layout === 'phone' && S.phoneView === 'session')) {
      e.preventDefault();
      closeDetail();
    }
  });

  // ---------- Installed app (PWA) ----------
  // The Dock badge shows the tab-title count; "(!)" becomes a plain dot. The window's title bar follows
  // the theme. Snapshots (made-up data) never touch the badge or register the service worker.
  var live = typeof window.__STATUS_SOURCE__ !== 'function';
  var lastBadge, lastThemeColour;
  function appChrome(badge) {
    var colour = theme() === 'dark' ? '#161B22' : '#E3E8EE';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta && colour !== lastThemeColour) { meta.setAttribute('content', colour); lastThemeColour = colour; }
    if (!live || !navigator.setAppBadge || badge === lastBadge) return;
    lastBadge = badge;
    var p = badge === null || badge === 0 ? navigator.clearAppBadge() : badge === '!' ? navigator.setAppBadge() : navigator.setAppBadge(badge);
    if (p && p.catch) p.catch(function () { /* not installed, or badges turned off */ });
  }
  if (live && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () { /* no PWA, page still works */ }); });
  }

  // ---------- Start ----------
  window.addEventListener('resize', function () { if (layoutFor(window.innerWidth) !== S.layout) render(); });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', function () { if (!S.theme) render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  render();
  load();
  // Poll even while the tab is in the background: that's when the tab-title count is read.
  var pollTimer = setInterval(load, POLL_MS);
  // config.json sets how often to poll; read once, so a change needs a page reload.
  if (live) fetch('/config.json', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (c) {
    if (c && c.replyEnabled === true && !S.replyOn) { S.replyOn = true; render(); }
    var s = c && c.pageRefreshSeconds;
    if (typeof s !== 'number' || !(s >= 2 && s <= 300) || s * 1000 === POLL_MS) return;
    POLL_MS = s * 1000;
    clearInterval(pollTimer);
    pollTimer = setInterval(load, POLL_MS);
  }).catch(function () { /* keep the default */ });
})();
</script>
</body>
</html>
