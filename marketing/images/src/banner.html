<!doctype html>
<!-- Made-up scene for marketing: a macOS-style notification from Sessionbell over a generic desktop.
     Rendered to ../sessionbell-banner.png with headless Chrome at 1600x1000, 2x. -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: radial-gradient(1200px 800px at 15% 10%, #9fb8d9 0%, transparent 60%),
                radial-gradient(1000px 900px at 90% 90%, #c7a9cf 0%, transparent 55%),
                linear-gradient(135deg, #6f8fb8, #a99bc4 55%, #d6b9b0); }
  .menubar { height: 34px; background: rgba(255,255,255,.28); backdrop-filter: blur(20px); display: flex; align-items: center;
    justify-content: flex-end; gap: 22px; padding: 0 20px; color: #1b1d22; font-size: 15px; font-weight: 500; }
  .dot { width: 16px; height: 16px; border-radius: 4px; background: rgba(0,0,0,.55); }
  /* A generic editor window in the background, blurred: you're busy elsewhere. */
  .win { position: absolute; left: 90px; top: 110px; width: 1000px; height: 800px; border-radius: 14px; background: #1e2127;
    box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; filter: blur(1.5px); }
  .win .bar { height: 44px; background: #2a2e36; display: flex; gap: 9px; align-items: center; padding-left: 16px; }
  .win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #555c68; display: block; }
  .code { padding: 28px 34px; display: grid; gap: 15px; }
  .code b { display: block; height: 13px; border-radius: 7px; background: #3a4150; }
  .code b.k { background: #4f6a8f; } .code b.s { background: #5b7d5b; } .code b.f { background: #8a6f4d; }
  /* The banner */
  .note { position: absolute; right: 22px; top: 50px; width: 520px; padding: 18px 20px; border-radius: 22px;
    background: rgba(246,246,248,.82); backdrop-filter: blur(30px) saturate(1.6); box-shadow: 0 10px 40px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.12);
    display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; color: #16181d; }
  .note img { width: 52px; height: 52px; }
  .t { font-size: 18px; font-weight: 650; letter-spacing: -.1px; }
  .b { font-size: 17px; color: #2a2d33; margin-top: 3px; line-height: 1.3; }
  .when { align-self: start; font-size: 14px; color: #6b6f78; margin-top: 2px; }
</style></head><body>
  <div class="menubar"><span class="dot"></span><span class="dot"></span><span>Tue 17 Nov&nbsp;&nbsp;15:42</span></div>
  <div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="code">
    <b class="k" style="width:38%"></b><b style="width:62%"></b><b class="s" style="width:48%"></b><b style="width:71%"></b>
    <b class="f" style="width:30%"></b><b style="width:55%"></b><b style="width:66%"></b><b class="k" style="width:42%"></b>
    <b style="width:58%"></b><b class="s" style="width:35%"></b><b style="width:74%"></b><b style="width:50%"></b>
    <b class="f" style="width:44%"></b><b style="width:61%"></b><b style="width:28%"></b><b class="k" style="width:53%"></b>
    <b style="width:69%"></b><b class="s" style="width:40%"></b><b style="width:57%"></b><b style="width:46%"></b>
    <b style="width:64%"></b><b class="f" style="width:33%"></b><b style="width:59%"></b><b style="width:49%"></b>
  </div></div>
  <div class="note"><img src="icon.svg" alt=""><div><div class="t">Sessionbell</div>
    <div class="b">Fix dark mode on the settings screen</div></div><div class="when">now</div></div>
</body></html>
